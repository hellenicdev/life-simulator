<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A scroll-based life simulator where you enter your habits and watch a unique timeline of your life unfold. Each run generates different events based on probabilistic outcomes, from success to burnout. At the end, you get a personal life summary and global stats comparing your results with others.">
  <meta name="keywords" content="HellenicDev, programming, HTML, CSS, JS, open-source, projects, web-development, arcade, educational, fun, game, mimi, simple, simulation, life, random, events, compare">
  <meta name="author" content="HellenicDev">
  <meta name="theme-color" content="#19336e">
  <meta property="og:title" content="Life Timeline Simulator">
  <meta property="og:description" content="A scroll-based life simulator where you enter your habits and watch a unique timeline of your life unfold.">
  <meta property="og:url" content="https://hellenicdev.eu/life-simulator/frontend/">
  <meta property="og:type" content="website">
  <title>Life Timeline Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Life Timeline Simulator</h1>
  <p class="subtitle">Adjust your habits and see how your life unfolds</p>

  <div class="controls">
    <div class="slider-group">
      <div class="slider-row">
        <label>🎂 Starting Age: <span id="ageVal">20</span></label>
        <input type="range" id="age" min="10" max="60" value="20">
      </div>
      <div class="slider-row">
        <label>😴 Sleep (hrs): <span id="sleepVal">7</span></label>
        <input type="range" id="sleep" min="0" max="12" value="7">
      </div>
      <div class="slider-row">
        <label>💼 Work (hrs): <span id="workVal">8</span></label>
        <input type="range" id="work" min="0" max="16" value="8">
      </div>
      <div class="slider-row">
        <label>🎮 Fun (hrs): <span id="funVal">4</span></label>
        <input type="range" id="fun" min="0" max="12" value="4">
      </div>
    </div>
    <div class="slider-group">
      <div class="slider-row">
        <label>🏃 Exercise (hrs): <span id="exerciseVal">3</span></label>
        <input type="range" id="exercise" min="0" max="10" value="3">
      </div>
      <div class="slider-row">
        <label>👥 Social (hrs): <span id="socialVal">5</span></label>
        <input type="range" id="social" min="0" max="12" value="5">
      </div>
      <div class="slider-row">
        <label>🥗 Diet Quality: <span id="dietVal">6</span></label>
        <input type="range" id="diet" min="0" max="10" value="6">
      </div>
      <div class="slider-row">
        <label>📚 Education: <span id="educationVal">5</span></label>
        <input type="range" id="education" min="0" max="10" value="5">
      </div>
      <div class="slider-row">
        <label>💰 Financial Savvy: <span id="financeVal">5</span></label>
        <input type="range" id="finance" min="0" max="10" value="5">
      </div>
      <div class="slider-row">
        <label>🎲 Risk Tolerance: <span id="riskVal">5</span></label>
        <input type="range" id="risk" min="0" max="10" value="5">
      </div>
    </div>

    <div class="button-group">
      <button onclick="startSimulation()" id="simBtn">▶ Simulate Life</button>
      <button onclick="reroll()" id="rerollBtn">🔄 Alternate Timeline</button>
    </div>
  </div>

  <div id="loading" class="loading hidden">⏳ Crafting your life...</div>

  <div class="timeline-wrapper">
    <svg id="timelineLine">
      <line x1="50%" y1="0" x2="50%" y2="3000" stroke="#00ffcc" stroke-width="4"/>
    </svg>
    <div id="timeline"></div>
  </div>

  <div id="scoreboard" class="hidden"></div>
  <div id="summary"></div>
  <div id="stats"></div>
</div>

<audio id="popSound" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>
<script src="script.js"></script>

</body>
</html>
