<meta property="og:description" content="A scroll-based life simulator where you enter your habits and watch a unique timeline of your life unfold. Each run generates different events based on probabilistic outcomes, from success to burnout. At the end, you get a personal life summary and global stats comparing your results with others.">
<meta property="og:url" content="https://hellenicdev.github.io/life-simulator/frontend/"

  <title>Life Timeline Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Life Timeline Simulator</h1>

<div class="controls">
  <label>Age: <span id="ageVal">20</span></label>
  <input type="range" id="age" min="10" max="60" value="20">

  <label>Sleep: <span id="sleepVal">7</span></label>
  <input type="range" id="sleep" min="0" max="12" value="7">

  <label>Work: <span id="workVal">8</span></label>
  <input type="range" id="work" min="0" max="16" value="8">

  <label>Fun: <span id="funVal">4</span></label>
  <input type="range" id="fun" min="0" max="10" value="4">

  <button onclick="startSimulation()">Simulate Life</button>
  <button onclick="reroll()">Alternate Timeline</button>
</div>

<div class="timeline-wrapper">
  <svg id="timelineLine">
    <line x1="50%" y1="0" x2="50%" y2="3000" stroke="#00ffcc" stroke-width="4"/>
  </svg>

  <div id="timeline"></div>
</div>

<div id="summary"></div>
<div id="stats"></div>

<audio id="popSound" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>

<script src="script.js"></script>
